<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-brown-dark { background-color: #4A3525 !important; }

        .bg-beige { background-color: #D7C49E !important; }

        .bg-beige-light { background-color: #F9F6F0 !important; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="./index.html">Bookstore</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./index.html">Home</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="./books.html?category=all">Wszystkie książki</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./books.html?category=new">Nowe</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./books.html?category=used">Używane</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./books.html?category=damaged">Zniszczone</a>
            </li>

          </ul>
          <span class="navbar-text">
              <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                  <a class="nav-link" href="./profile.html">Profil</a>
                  <a class="nav-link" href="./admin.html">Admin</a>
                  </li>
              </ul>
          </span>
        </div>
      </div>
    </nav>


<div class="container">
        <div class="row g-4">

            <div class="col-md-4 d-flex justify-content-center align-items-start">
                <div class="card shadow-sm" style="width: 100%;">
                  <img src="../assets/user.png" class="card-img-top bg-light p-3" alt="user icon" style="max-height: 250px; object-fit: contain;">
                  <div class="card-body text-center">
                    <h5 class="card-title fw-bold" id="card-user-name">Adam Nowak</h5>
                    <a href="#sekcja-historia" class="btn bg-brown-dark text-white w-100" onclick="loadUserData()">Zobacz dane klienta</a>
                  </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card p-4 shadow-sm bg-white mb-4">
                    <h4 class="mb-3 text-dark border-bottom pb-2">Dane</h4>

                    <form id="formularz-profilu" onsubmit="saveProfileData(event)">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Imię</label>
                                <input type="text" class="form-control" id="input-imie" value="Jan" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Nazwisko</label>
                                <input type="text" class="form-control" id="input-nazwisko" value="Kowalski" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Adres dostawy</label>
                            <input type="text" class="form-control" id="input-adres" value="Floriańska 10, 31-021 Kraków" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Numer telefonu</label>
                                <input type="tel" class="form-control" id="input-telefon" value="+48 123 456 789" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-bold">Adres Email</label>
                                <input type="email" class="form-control" id="input-email" value="jan.kowalski@student.pl" required>
                            </div>
                        </div>

                        <button type="submit" class="btn bg-brown-dark text-white mt-2">
                            Zapisz zmiany w bazie danych
                        </button>
                    </form>
                </div>

                <div class="card p-4 shadow-sm bg-white" id="sekcja-historia">
                    <h4 class="mb-1 text-dark border-bottom pb-2">Historia zamówień</h4>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID Zamówienia</th>
                                    <th>Data zakupu</th>
                                    <th>Książka</th>
                                    <th>Stan</th>
                                    <th>Cena</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-historii">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>



    <script>
        // bazowy adres URL dla zapytań do API
        const API_URL = "http://127.0.0.1:5000/api";
        const CUSTOMER_ID = 1; // przykład dla klienta 1

        // pobierająca historię zamówień klienta z serwera
        function fetchOrders(){
            fetch(`${API_URL}/customer/${CUSTOMER_ID}/history`)
                .then(response => response.json())
                .then(ordersList => {
                    // wyświetlamy pobrane dane
                        displayHistory(ordersList);
                })
                .catch(err => console.error("Błąd:", err));

        }


        // wyświetlanie danych
        function displayHistory(orders) {
            const table = document.getElementById('tabela-historii');
            if (!table) return;
            // czyszczenie tabeli przed załadowaniem nowych danych
            table.innerHTML = "";

            if (!orders || orders.length === 0) {
                table.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Brak zamówień w bazie danych.</td></tr>`;
                return;
            }

            // dla każdego zamówienia
            orders.forEach(ord => {
                // ustawienie koloru plakeitni zależnego od stanu książki
                let conditionBadge = ord.condition === "new" ? "bg-success" : "bg-warning text-dark";
                // łączna kwota całego zamówienia
                let price = (ord.price * ord.quantity).toFixed(2);

                table.innerHTML += `
                    <tr>
                        <td>#${ord.order_id}</td>
                        <td><small class="text-muted">${ord.order_date}</small></td>
                        <td class="fw-bold">${ord.title}</td>
                        <td><span class="badge ${conditionBadge}">${ord.condition}</span></td>
                        <td class="text-primary fw-bold">${price}</td>
                    </tr>
                `;
            });
        }

        // ładująca aktualne dane użytkownika do formularza
        function loadUserData(){

            const fullName = document.getElementById('card-user-name').innerText;
            const splitName = fullName.split(' ');
            const firstName = splitName[0];
            const lastName = splitName[1];

            // wyciąganie danych klienta na podstawie imienia i nazwiska
            fetch(`${API_URL}/customer/search?first_name=${firstName}&last_name=${lastName}`)
                .then(response => response.json())
                .then(customer => {
                    if (customer) {
                        document.getElementById('input-imie').value = customer.first_name;
                        document.getElementById('input-nazwisko').value = customer.last_name;
                        document.getElementById('input-adres').value = customer.address;
                        document.getElementById('input-telefon').value = customer.phone;
                        document.getElementById('input-email').value = customer.email;

                    } else {
                        alert("Nie znaleziono klienta w bazie");
                    }
                })
                .catch(err => console.error("Błąd:", err));

        }

        // zapisuje zmiany danych klienta do bazy
        function saveProfileData(event) {
            event.preventDefault();

            // słownik z wszystkimi danymi użytkownika z formularza
            const customerData = {
                first_name: document.getElementById('input-imie').value,
                last_name: document.getElementById('input-nazwisko').value,
                address: document.getElementById('input-adres').value,
                phone: document.getElementById('input-telefon').value,
                email: document.getElementById('input-email').value
            };

            fetch(`${API_URL}/customer/${CUSTOMER_ID}/update`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(customerData)
            })
            .then(response => response.json())
            .then(result => { // podmiana imienia i nazwiska w karcie klienta
                document.getElementById('card-user-name').innerText = customerData.first_name + " " + customerData.last_name;
            })
            .catch(err => console.error("Błąd:", err));

        }


        fetchOrders();
    </script>
</body>

</html>
