<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookstore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-brown-dark { background-color: #4A3525 !important; }

        .bg-beige { background-color: #D7C49E !important; }

        .bg-beige-light { background-color: #F9F6F0 !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="./index.html">Bookstore</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./index.html">Home</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="./books.html?category=all">Wszystkie książki</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./books.html?category=new">Nowe</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./books.html?category=used">Używane</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./books.html?category=damaged">Zniszczone</a>
            </li>

          </ul>
          <span class="navbar-text">
              <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                  <li class="nav-item">
                  <a class="nav-link" href="./profile.html">Profil</a>
                  <a class="nav-link" href="./admin.html">Admin</a>
                  </li>
              </ul>
          </span>
        </div>
      </div>
    </nav>

<div class="container mt-4">

        <div class="card p-4 shadow-sm bg-white">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Tytuł</th>
                            <th>Autor</th>
                            <th>Gatunek</th>
                            <th>Stan</th>
                            <th>Cena</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-ksiazek">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    // bazowy adres URL dla zapytań do API
    const API_URL = "http://127.0.0.1:5000/api";

    // funkcja ładująca odpowiednio przefiltrowane książki
    function loadBooks(){
        // parametry z adresu URL
        const params = new URLSearchParams(window.location.search);
        const category = params.get('category') || 'all';
        const table = document.getElementById('tabela-ksiazek');
        // wczytanie tekstu wyszukiwanego
        const searchQuery = params.get('search') ? params.get('search').toLowerCase().trim() : '';
        // czyszczenie tabeli przed wczytaniem danych
        table.innerHTML = "";

        // dobór adresu api zależnego od kategorii
        let endpointUrl;//bez tego nie we wszystkich wersjach przeglądarek (Strict JS przejdzie)
        if (category === 'used') {
            endpointUrl = `${API_URL}/books/outlet/used`;
        } else if (category === 'damaged') {
            endpointUrl = `${API_URL}/books/outlet/damaged`;
        } else if (category === 'new') {
            endpointUrl = `${API_URL}/books/regular`;
        }else { // dla czegokolwiek innego lub braku wybieramy wszystkie
            endpointUrl = `${API_URL}/books/all`;
        }


        fetch(endpointUrl)
            .then(response => response.json()) // odpowiedź na json
            .then(books => {

                let filteredBooks = books;

                // jeśli użytkownik coś wyszukiwął ot filtrujemy po wyszukiwaniu
                if (searchQuery) {
                    filteredBooks = books.filter(k =>
                        k.title.toLowerCase().includes(searchQuery) ||
                        k.author.toLowerCase().includes(searchQuery)
                    );
                }


                // dla każdej książki
                filteredBooks.forEach(k => {

                // ustawienie plakietki stanu - napis i kolor
                let stanBadge = "";
                if(k.condition === 'new') stanBadge = '<span class="badge bg-success">Nowa</span>';
                else if(k.condition === 'used') stanBadge = '<span class="badge bg-warning text-dark">Używana</span>';
                else stanBadge = '<span class="badge bg-danger">Zniszczona</span>';

                // sprawdzenie czy istenieje cena po obniżce jak nei to bierzemy bazową
                let price = k.price_with_discount !== undefined ? parseFloat(k.price_with_discount).toFixed(2) : parseFloat(k.price).toFixed(2);

                // dodanie wiersza z danymi książki do tabeli
                table.innerHTML += `
                    <tr>
                        <td class="fw-bold">${k.title}</td>
                        <td>${k.author}</td>
                        <td><span class="badge bg-secondary">${k.genre}</span></td>
                        <td>${stanBadge}</td>
                        <td class="text-danger fw-bold">${price}</td>
                    </tr>
                    `;
                });
                })
            .catch(err => console.error("Błąd:", err));
    }

    loadBooks();

</script>


</body>
</html>
